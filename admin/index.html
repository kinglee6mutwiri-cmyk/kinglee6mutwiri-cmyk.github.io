<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kinglee6 Mutwiri — Admin Login</title>
    <meta name="robots" content="noindex, nofollow">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            color: #171717;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border: 1px solid #ddd7ca;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #333;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 7px;
            background: #171717;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            line-height: 1.5;
            font-size: 14px;
        }

        .error {
            color: #b00020;
        }

        .success {
            color: #16733a;
        }
    </style>
</head>

<body>

    <main class="login-box">
        <h1>Kinglee6 Mutwiri</h1>

        <p class="subtitle">
            Admin dashboard login
        </p>

        <form id="loginForm">

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Sign in
            </button>

        </form>

        <div id="message"></div>
    </main>

    <!-- Supabase JavaScript library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
const SUPABASE_URL = "https://txtathyhuuopxuiooihl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_6hbII9z4E4cmBzvknweGfA_I_tHs5Ow";
        const supabaseClient = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";
            message.textContent = "";
            message.className = "";

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                message.textContent = error.message;
                message.className = "error";

                loginButton.disabled = false;
                loginButton.textContent = "Sign in";
                return;
            }

            message.textContent = "Login successful. Opening dashboard...";
            message.className = "success";

            setTimeout(function () {
                window.location.href = "dashboard.html";
            }, 800);
        });
    </script>

</body>
</html>

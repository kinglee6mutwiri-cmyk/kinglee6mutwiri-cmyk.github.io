<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kinglee6 Mutwiri — Dashboard</title>
    <meta name="robots" content="noindex, nofollow">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            color: #171717;
        }

        header {
            background: #171717;
            color: white;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 21px;
        }

        #logoutButton {
            border: 1px solid #777;
            background: transparent;
            color: white;
            padding: 9px 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        main {
            width: 100%;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .welcome p {
            margin: 0;
            color: #666;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border: 1px solid #ddd7ca;
            border-radius: 10px;
            padding: 24px;
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 16px;
            color: #666;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        .panel {
            background: white;
            border: 1px solid #ddd7ca;
            border-radius: 10px;
            padding: 24px;
            margin-bottom: 22px;
        }

        .panel h2 {
            margin-top: 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .action {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 7px;
            background: #171717;
            color: white;
            text-decoration: none;
        }

        .action.secondary {
            background: #e8e2d7;
            color: #171717;
        }

        #status {
            color: #666;
            margin-top: 10px;
        }

        @media (max-width: 700px) {
            .cards {
                grid-template-columns: 1fr;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Kinglee6 Mutwiri Admin</h1>
    <button id="logoutButton">Log out</button>
</header>

<main>

    <section class="welcome">
        <h2>Dashboard</h2>
        <p id="adminEmail">Checking your account...</p>
    </section>

    <section class="cards">

        <div class="card">
            <h3>Total Articles</h3>
            <div class="number" id="totalArticles">—</div>
        </div>

        <div class="card">
            <h3>Published</h3>
            <div class="number" id="publishedArticles">—</div>
        </div>

        <div class="card">
            <h3>Drafts</h3>
            <div class="number" id="draftArticles">—</div>
        </div>

    </section>

    <section class="panel">
        <h2>Content Management</h2>

        <div class="actions">
            <a class="action" href="new-article.html">
                New Article
            </a>

            <a class="action secondary" href="articles.html">
                Manage Articles
            </a>

            <a class="action secondary" href="categories.html">
                Categories
            </a>

            <a class="action secondary" href="../index.html">
                View Website
            </a>
        </div>
    </section>

    <section class="panel">
        <h2>System Status</h2>
        <p id="status">Connecting to Supabase...</p>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL =
        "https://txtathyhuuopxuiooihl.supabase.co";

    const SUPABASE_ANON_KEY =
        "sb_publishable_6hbII9z4E4cmBzvknweGfA_I_tHs5Ow";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );

    const ADMIN_USER_ID =
        "eb57b285-f6f3-462c-acd7-6b0d1d77cc44";

    async function loadDashboard() {

        const {
            data: { user },
            error: userError
        } = await supabaseClient.auth.getUser();

        if (userError || !user) {
            window.location.href = "index.html";
            return;
        }

        if (user.id !== ADMIN_USER_ID) {
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
            return;
        }

        document.getElementById("adminEmail").textContent =
            "Signed in as " + user.email;

        const { data: articles, error } =
            await supabaseClient
                .from("articles")
                .select("id, published");

        if (error) {
            document.getElementById("status").textContent =
                "Database connection error: " + error.message;
            return;
        }

        const total = articles.length;

        const published = articles.filter(
            article => article.published === true
        ).length;

        const drafts = articles.filter(
            article => article.published !== true
        ).length;

        document.getElementById("totalArticles").textContent = total;
        document.getElementById("publishedArticles").textContent = published;
        document.getElementById("draftArticles").textContent = drafts;

        document.getElementById("status").textContent =
            "Supabase connection successful.";
    }

    document
        .getElementById("logoutButton")
        .addEventListener("click", async function () {

            await supabaseClient.auth.signOut();

            window.location.href = "index.html";
        });

    loadDashboard();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Manage Articles | Kinglee6 Mutwiri</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1ea;
      color: #171717;
    }

    header {
      background: #171717;
      color: white;
      padding: 18px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      color: #d8d8d8;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .topbar h2 {
      margin: 0;
      font-size: 25px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button,
    a.button {
      border: 0;
      padding: 10px 14px;
      border-radius: 7px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
    }

    .primary {
      background: #171717;
      color: white;
    }

    .secondary {
      background: #ddd5ca;
      color: #171717;
    }

    .danger {
      background: #b42318;
      color: white;
    }

    .success {
      background: #217346;
      color: white;
    }

    .search-box {
      margin-bottom: 18px;
    }

    .search-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cfc7bc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    .status {
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #ddd;
      display: none;
    }

    .table-wrap {
      background: white;
      border-radius: 10px;
      overflow-x: auto;
      border: 1px solid #ddd6cc;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #eee8df;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    td {
      font-size: 14px;
    }

    .article-title {
      font-weight: 600;
      max-width: 300px;
    }

    .slug {
      color: #666;
      font-size: 12px;
      margin-top: 4px;
      word-break: break-word;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .published {
      background: #e3f4e8;
      color: #176b36;
    }

    .draft {
      background: #f3ead8;
      color: #76540b;
    }

    .row-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .row-actions button {
      font-size: 12px;
      padding: 7px 9px;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    @media (max-width: 700px) {
      main {
        margin-top: 20px;
      }

      .topbar {
        align-items: flex-start;
      }

      .topbar h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Kinglee6 Mutwiri Admin</h1>
  <p>Manage your articles</p>
</header>

<main>

  <div class="topbar">
    <h2>Articles</h2>

    <div class="actions">
      <a class="button secondary" href="dashboard.html">Dashboard</a>
      <a class="button primary" href="new-article.html">New Article</a>
    </div>
  </div>

  <div class="search-box">
    <input
      type="search"
      id="searchInput"
      placeholder="Search articles by title or slug..."
      autocomplete="off"
    >
  </div>

  <div id="statusMessage" class="status"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Article</th>
          <th>Category</th>
          <th>Status</th>
          <th>Created</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="articlesBody">
        <tr>
          <td colspan="5" class="loading">Loading articles...</td>
        </tr>
      </tbody>
    </table>
  </div>

</main>

<script>
  const SUPABASE_URL = "https://txtathyhuuopxuiooihl.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_6hbII9z4E4cmBzvknweGfA_I_tHs5Ow";

  const ADMIN_UID = "eb57b285-f6f3-462c-acd7-6b0d1d77cc44";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  let allArticles = [];
  let categories = {};

  const articlesBody = document.getElementById("articlesBody");
  const searchInput = document.getElementById("searchInput");
  const statusMessage = document.getElementById("statusMessage");

  function showStatus(message, error = false) {
    statusMessage.textContent = message;
    statusMessage.style.display = "block";
    statusMessage.style.background = error ? "#fce8e6" : "#e9f5ec";
    statusMessage.style.color = error ? "#a61b1b" : "#176b36";
  }

  function hideStatus() {
    statusMessage.style.display = "none";
  }

  function escapeHTML(value) {
    if (value === null || value === undefined) return "";

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(dateValue) {
    if (!dateValue) return "—";

    const date = new Date(dateValue);

    if (Number.isNaN(date.getTime())) {
      return "—";
    }

    return date.toLocaleDateString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });
  }

  async function checkAdmin() {
    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {
      window.location.href = "index.html";
      return false;
    }

    if (user.id !== ADMIN_UID) {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
      return false;
    }

    return true;
  }

  async function loadCategories() {
    const { data, error } = await supabaseClient
      .from("categories")
      .select("id, name")
      .order("name");

    if (error) {
      throw error;
    }

    categories = {};

    for (const category of data || []) {
      categories[category.id] = category.name;
    }
  }

  async function loadArticles() {
    articlesBody.innerHTML = `
      <tr>
        <td colspan="5" class="loading">Loading articles...</td>
      </tr>
    `;

    const { data, error } = await supabaseClient
      .from("articles")
      .select(`
        id,
        title,
        slug,
        category_id,
        published,
        created_at,
        updated_at,
        published_at
      `)
      .order("created_at", { ascending: false });

    if (error) {
      throw error;
    }

    allArticles = data || [];

    renderArticles(allArticles);
  }

  function renderArticles(articles) {
    if (!articles.length) {
      articlesBody.innerHTML = `
        <tr>
          <td colspan="5" class="empty">
            No articles found.
          </td>
        </tr>
      `;
      return;
    }

    articlesBody.innerHTML = articles.map(article => {

      const statusClass = article.published
        ? "published"
        : "draft";

      const statusText = article.published
        ? "Published"
        : "Draft";

      const toggleText = article.published
        ? "Unpublish"
        : "Publish";

      const toggleClass = article.published
        ? "secondary"
        : "success";

      return `
        <tr>
          <td>
            <div class="article-title">
              ${escapeHTML(article.title)}
            </div>

            <div class="slug">
              /${escapeHTML(article.slug)}
            </div>
          </td>

          <td>
            ${escapeHTML(
              categories[article.category_id] || "Uncategorised"
            )}
          </td>

          <td>
            <span class="badge ${statusClass}">
              ${statusText}
            </span>
          </td>

          <td>
            ${formatDate(article.created_at)}
          </td>

          <td>
            <div class="row-actions">

              <button
                class="primary"
                onclick="editArticle(${article.id})"
              >
                Edit
              </button>

              <button
                class="${toggleClass}"
                onclick="togglePublished(${article.id}, ${article.published})"
              >
                ${toggleText}
              </button>

              <button
                class="danger"
                onclick="deleteArticle(${article.id}, '${escapeHTML(article.title).replace(/'/g, "\\'")}')"
              >
                Delete
              </button>

            </div>
          </td>
        </tr>
      `;
    }).join("");
  }

  function editArticle(id) {
    window.location.href = `edit-article.html?id=${encodeURIComponent(id)}`;
  }

  async function togglePublished(id, currentStatus) {
    const newStatus = !currentStatus;

    const action = newStatus
      ? "publish"
      : "unpublish";

    const confirmed = confirm(
      `Are you sure you want to ${action} this article?`
    );

    if (!confirmed) return;

    hideStatus();

    const updateData = {
      published: newStatus,
      published_at: newStatus
        ? new Date().toISOString()
        : null,
      updated_at: new Date().toISOString()
    };

    const { error } = await supabaseClient
      .from("articles")
      .update(updateData)
      .eq("id", id);

    if (error) {
      showStatus(
        "Could not update the article: " + error.message,
        true
      );
      return;
    }

    showStatus(
      newStatus
        ? "Article published successfully."
        : "Article unpublished successfully."
    );

    await loadArticles();
  }

  async function deleteArticle(id, title) {
    const confirmed = confirm(
      `Delete this article?\n\n${title}\n\nThis cannot be undone.`
    );

    if (!confirmed) return;

    hideStatus();

    const { error } = await supabaseClient
      .from("articles")
      .delete()
      .eq("id", id);

    if (error) {
      showStatus(
        "Could not delete the article: " + error.message,
        true
      );
      return;
    }

    showStatus("Article deleted successfully.");

    await loadArticles();
  }

  searchInput.addEventListener("input", function () {
    const query = this.value.trim().toLowerCase();

    if (!query) {
      renderArticles(allArticles);
      return;
    }

    const filtered = allArticles.filter(article => {
      const title = (article.title || "").toLowerCase();
      const slug = (article.slug || "").toLowerCase();
      const category = (
        categories[article.category_id] || ""
      ).toLowerCase();

      return (
        title.includes(query) ||
        slug.includes(query) ||
        category.includes(query)
      );
    });

    renderArticles(filtered);
  });

  async function start() {
    try {
      const isAdmin = await checkAdmin();

      if (!isAdmin) return;

      await loadCategories();
      await loadArticles();

    } catch (error) {
      console.error(error);

      articlesBody.innerHTML = `
        <tr>
          <td colspan="5" class="empty">
            Could not load articles.
          </td>
        </tr>
      `;

      showStatus(
        "Error loading articles: " + error.message,
        true
      );
    }
  }

  start();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Messages | Kinglee6 Mutwiri Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      color: #ccc;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .topbar h2 {
      margin: 0;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button,
    .button {
      border: 0;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
    }

    .dashboard {
      background: #222;
      color: white;
    }

    .refresh {
      background: #ddd;
      color: #111;
    }

    .message {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .message.unread {
      border-left: 5px solid #111;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .message h3 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .sender {
      color: #555;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .message-body {
      white-space: pre-wrap;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .date {
      color: #777;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 12px;
      background: #eee;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .read-btn {
      background: #222;
      color: white;
    }

    .delete-btn {
      background: #eee;
      color: #111;
    }

    .empty,
    .error {
      background: white;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
    }

    .error {
      color: #a00;
    }

    @media (max-width: 600px) {
      .container {
        padding: 0 12px;
      }

      .message {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Kinglee6 Mutwiri Admin</h1>
  <p>Contact Messages</p>
</header>

<div class="container">

  <div class="topbar">
    <h2>Messages</h2>

    <div class="buttons">
      <a class="button dashboard" href="dashboard.html">Dashboard</a>
      <button class="refresh" onclick="loadMessages()">Refresh</button>
    </div>
  </div>

  <div id="messages">
    <div class="empty">Loading messages...</div>
  </div>

</div>

<script>
  const SUPABASE_URL = "https://txtathyhuuopxuiooihl.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_6hbII9z4E4cmBzvknweGfA_I_tHs5Ow";
  const ADMIN_UID = "eb57b285-f6f3-462c-acd7-6b0d1d77cc44";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  async function checkAdmin() {
    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if (error || !user || user.id !== ADMIN_UID) {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
      return false;
    }

    return true;
  }

  async function loadMessages() {
    const container = document.getElementById("messages");

    container.innerHTML = '<div class="empty">Loading messages...</div>';

    const allowed = await checkAdmin();

    if (!allowed) return;

    const { data, error } = await supabaseClient
      .from("contact_messages")
      .select("id, name, email, subject, message, read, created_at")
      .order("created_at", { ascending: false });

    if (error) {
      container.innerHTML =
        '<div class="error">Unable to load messages: ' +
        escapeHtml(error.message) +
        '</div>';
      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML =
        '<div class="empty">No messages found.</div>';
      return;
    }

    container.innerHTML = data.map(message => `
      <article class="message ${message.read ? "" : "unread"}">
        <div class="message-header">
          <div>
            <h3>${escapeHtml(message.subject)}</h3>
            <div class="sender">
              ${escapeHtml(message.name)}
              —
              ${escapeHtml(message.email)}
            </div>
          </div>

          <span class="status">
            ${message.read ? "Read" : "Unread"}
          </span>
        </div>

        <div class="date">
          ${formatDate(message.created_at)}
        </div>

        <div class="message-body">
          ${escapeHtml(message.message)}
        </div>

        <div class="actions">
          <button
            class="read-btn"
            onclick="toggleRead(${message.id}, ${message.read})">
            ${message.read ? "Mark Unread" : "Mark Read"}
          </button>

          <button
            class="delete-btn"
            onclick="deleteMessage(${message.id})">
            Delete
          </button>
        </div>
      </article>
    `).join("");
  }

  async function toggleRead(id, currentStatus) {
    const allowed = await checkAdmin();

    if (!allowed) return;

    const { error } = await supabaseClient
      .from("contact_messages")
      .update({ read: !currentStatus })
      .eq("id", id);

    if (error) {
      alert("Could not update message: " + error.message);
      return;
    }

    loadMessages();
  }

  async function deleteMessage(id) {
    const confirmed = confirm(
      "Delete this message permanently?"
    );

    if (!confirmed) return;

    const allowed = await checkAdmin();

    if (!allowed) return;

    const { error } = await supabaseClient
      .from("contact_messages")
      .delete()
      .eq("id", id);

    if (error) {
      alert("Could not delete message: " + error.message);
      return;
    }

    loadMessages();
  }

  function formatDate(dateString) {
    return new Date(dateString).toLocaleString();
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  loadMessages();
</script>

</body>
</html>
